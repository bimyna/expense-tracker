
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #152b55;
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            padding: 22px 15px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .card h3 {
            margin: 0 0 12px;
            color: #666;
            font-size: 15px;
        }

        .value {
            font-size: 23px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .income-value {
            color: #138a48;
        }

        .expense-value {
            color: #d63b3b;
        }

        .balance-value {
            color: #1758b5;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            margin-top: 0;
            color: #152b55;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: 2px solid #b9d1ff;
            border-color: #2463eb;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-btn {
            background: #2459c4;
            color: white;
        }

        .primary-btn:hover {
            background: #19459d;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .income-form {
            margin-bottom: 18px;
        }

        .income-form .field {
            flex: 1;
        }

        .income-form input {
            min-width: 0;
        }

        .expense-entry {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            margin: 12px 0;
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            background: #fafbfe;
        }

        .entry-details {
            overflow-wrap: anywhere;
        }

        .entry-details strong {
            display: block;
            margin-bottom: 7px;
        }

        .entry-details small {
            color: #666;
            line-height: 1.8;
        }

        .entry-amount {
            color: #d63b3b;
            font-weight: bold;
            white-space: nowrap;
        }

        .delete-btn {
            display: block;
            margin-top: 10px;
            padding: 7px 10px;
            background: #ffe7e7;
            color: #b42323;
            font-size: 12px;
        }

        .empty-message {
            color: #777;
            text-align: center;
            padding: 20px 0;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid #e0e4ec;
            margin-top: 20px;
            padding-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 17px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .panel {
                padding: 17px;
            }

            .value {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h1>My Expense Tracker</h1>
            <p>Track your income, manage expenses, and monitor your balance.</p>
        </header>

        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Income</h3>
                <div class="value income-value" id="income-display">
                    KSh 0.00
                </div>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <div class="value expense-value" id="expense-display">
                    KSh 0.00
                </div>
            </div>

            <div class="card">
                <h3>Remaining Balance</h3>
                <div class="value balance-value" id="balance-display">
                    KSh 0.00
                </div>
            </div>

        </section>

        <!-- INCOME SECTION -->
        <section class="panel">
            <h2>Add Income</h2>

            <form id="income-form">
                <div class="field">
                    <label for="income-amount">Income Amount (KSh)</label>
                    <input
                        type="number"
                        id="income-amount"
                        min="0.01"
                        step="0.01"
                        placeholder="e.g. 2000"
                        required
                    >
                </div>

                <div class="field">
                    <label for="income-source">Income Source</label>
                    <input
                        type="text"
                        id="income-source"
                        placeholder="e.g. Salary, business"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn full-width">
                    Add Income
                </button>
            </form>
        </section>

        <!-- EXPENSE FORM -->
        <section class="panel">
            <h2>Add New Expense</h2>

            <form id="expense-form">

                <div class="field">
                    <label for="expense-name">Expense Name</label>
                    <input
                        type="text"
                        id="expense-name"
                        placeholder="e.g. Shopping"
                        required
                    >
                </div>

                <div class="field">
                    <label for="amount">Amount (KSh)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 650"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="field">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Rent">Rent</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="field">
                    <label for="time">Time</label>
                    <input type="time" id="time" required>
                </div>

                <button type="submit" class="primary-btn full-width">
                    Add Expense
                </button>

            </form>
        </section>

        <!-- RECENT EXPENSES -->
        <section class="panel">
            <h2>Recent Expenses</h2>

            <div id="post-e">
                <p class="empty-message" id="empty-message">
                    No expenses added yet.
                </p>
            </div>

            <div class="summary">
                <span>Total Income:</span>
                <span id="summary-income">KSh 0.00</span>

                <span>Total Expenses:</span>
                <span id="summary-expenses">KSh 0.00</span>

                <span>Balance:</span>
                <span id="summary-balance">KSh 0.00</span>
            </div>
        </section>

    </div>

    <script>
        // Store the totals
        let totalIncome = 0;
        let totalExpenses = 0;

        // Store income and expense records
        let incomes = [];
        let expenses = [];

        // Format amounts as Kenyan shillings
        function formatMoney(amount) {
            return "KSh " + amount.toLocaleString("en-KE", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Update all dashboard and summary values
        function updateDashboard() {
            let balance = totalIncome - totalExpenses;

            document.getElementById("income-display").textContent =
                formatMoney(totalIncome);

            document.getElementById("expense-display").textContent =
                formatMoney(totalExpenses);

            document.getElementById("balance-display").textContent =
                formatMoney(balance);

            document.getElementById("summary-income").textContent =
                formatMoney(totalIncome);

            document.getElementById("summary-expenses").textContent =
                formatMoney(totalExpenses);

            document.getElementById("summary-balance").textContent =
                formatMoney(balance);

            // Show a different color if the balance is negative
            document.getElementById("balance-display").style.color =
                balance < 0 ? "#d63b3b" : "#1758b5";

            document.getElementById("summary-balance").style.color =
                balance < 0 ? "#d63b3b" : "#1758b5";
        }

        // Add income
        document.getElementById("income-form").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                let amount = Number(
                    document.getElementById("income-amount").value
                );

                let source = document.getElementById("income-source").value.trim();

                if (!Number.isFinite(amount) || amount <= 0 || source === "") {
                    alert("Enter a valid income amount and source.");
                    return;
                }

                totalIncome += amount;

                incomes.push({
                    amount: amount,
                    source: source
                });

                updateDashboard();

                this.reset();

                alert("Income added successfully!");
            }
        );

        // Add an expense
        document.getElementById("expense-form").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                let expenseName =
                    document.getElementById("expense-name").value.trim();

                let amount =
                    Number(document.getElementById("amount").value);

                let category =
                    document.getElementById("category").value;

                let date =
                    document.getElementById("date").value;

                let time =
                    document.getElementById("time").value;

                if (
                    expenseName === "" ||
                    !Number.isFinite(amount) ||
                    amount <= 0 ||
                    category === "" ||
                    date === "" ||
                    time === ""
                ) {
                    alert("Please fill in all fields with valid information.");
                    return;
                }

                // Save the expense
                const expense = {
                    id: crypto.randomUUID(),
                    name: expenseName,
                    amount: amount,
                    category: category,
                    date: date,
                    time: time
                };

                expenses.unshift(expense);

                // Recalculate the total expenses
                totalExpenses = expenses.reduce(function(total, item) {
                    return total + item.amount;
                }, 0);

                // Display the expense
                renderExpenses();

                // Update the dashboard
                updateDashboard();

                // Clear the form
                this.reset();
            }
        );

        // Display all expense records
        function renderExpenses() {
            const container = document.getElementById("post-e");
            container.replaceChildren();

            if (expenses.length === 0) {
                const message = document.createElement("p");
                message.className = "empty-message";
                message.textContent = "No expenses added yet.";
                container.appendChild(message);
                return;
            }

            expenses.forEach(function(expense) {
                const entry = document.createElement("div");
                entry.className = "expense-entry";

                const details = document.createElement("div");
                details.className = "entry-details";

                const name = document.createElement("strong");
                name.textContent = expense.name;

                const metadata = document.createElement("small");
                metadata.textContent =
                    expense.category + " | " +
                    expense.date + " at " + expense.time;

                const amount = document.createElement("div");
                amount.className = "entry-amount";
                amount.textContent = formatMoney(expense.amount);

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", function() {
                    const confirmed = confirm(
                        "Are you sure you want to delete this expense?"
                    );

                    if (!confirmed) {
                        return;
                    }

                    expenses = expenses.filter(function(item) {
                        return item.id !== expense.id;
                    });

                    totalExpenses = expenses.reduce(function(total, item) {
                        return total + item.amount;
                    }, 0);

                    renderExpenses();
                    updateDashboard();
                });

                details.appendChild(name);
                details.appendChild(metadata);
                details.appendChild(deleteButton);

                entry.appendChild(details);
                entry.appendChild(amount);

                container.appendChild(entry);
            });
        }

        // Set today's date and the current time as defaults
        function setDefaultDateTime() {
            const now = new Date();

            const localDate = [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, "0"),
                String(now.getDate()).padStart(2, "0")
            ].join("-");

            const localTime = [
                String(now.getHours()).padStart(2, "0"),
                String(now.getMinutes()).padStart(2, "0")
            ].join(":");

            document.getElementById("date").value = localDate;
            document.getElementById("time").value = localTime;
        }

        // Initialize the application
        setDefaultDateTime();
        updateDashboard();
    </script>
</body>
</html>
